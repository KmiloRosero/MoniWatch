# Render Blueprint for the MoniWatch API (free plan). Database: Neon PostgreSQL (free).
# Render > New > Blueprint > pick this repo. It asks for the values marked "sync: false".
services:
  - type: web
    name: moniwatch-api
    runtime: docker
    plan: free
    # Closest Render region to Colombia; create the Neon project in AWS us-east-1 (N. Virginia) too.
    region: virginia
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      # Neon connection string (direct, with sslmode=require).
      - key: DATABASE_URL
        sync: false

      # Secrets generated by Render (random base64, 256-bit): never typed or shared by anyone.
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: TOKEN_FINGERPRINT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY_ID
        value: key-v1

      - key: JWT_USER_ACCESS_TTL_SECONDS
        value: '900'
      - key: JWT_DEVICE_ACCESS_TTL_SECONDS
        value: '600'
      - key: USER_REFRESH_TOKEN_TTL_DAYS
        value: '30'
      - key: DEVICE_REFRESH_TOKEN_TTL_DAYS
        value: '30'
      - key: DEVICE_PAIRING_CODE_TTL_SECONDS
        value: '300'
      - key: DEVICE_PAIRING_CODE_LENGTH
        value: '8'
      - key: DEVICE_PAIRING_POLL_INTERVAL_SECONDS
        value: '3'
      # 10 rounds: still safe, and ~4x faster than 12 on the free plan's 0.1 CPU.
      - key: BCRYPT_SALT_ROUNDS
        value: '10'
      - key: PAYMENT_PIN_MAX_ATTEMPTS
        value: '5'
      - key: PAYMENT_PIN_LOCK_MINUTES
        value: '15'
      - key: TRANSACTION_EXPIRATION_MINUTES
        value: '15'
      - key: TRANSACTION_SWEEP_INTERVAL_SECONDS
        value: '60'

      - key: NEQUI_MODE
        value: SIMULATED
      # Set in the dashboard: SIMULATED, or LIVE once the Wompi keys below are set.
      # Not pinned here so a Blueprint sync never reverts it.
      - key: WOMPI_MODE
        sync: false
      - key: PAYMENT_SIMULATOR_APPROVAL_RATE
        value: '0.8'
      - key: PAYMENT_SIMULATOR_LATENCY_MS
        value: '400'
      - key: WOMPI_API_URL
        value: https://sandbox.wompi.co/v1
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_STATUS_POLL_ATTEMPTS
        value: '6'
      - key: WOMPI_STATUS_POLL_INTERVAL_MS
        value: '1000'

      # Render's proxy sits in front of the API: trust one hop so rate limits see real client IPs.
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: THROTTLE_TTL_SECONDS
        value: '60'
      - key: THROTTLE_LIMIT
        value: '120'
      - key: THROTTLE_SENSITIVE_LIMIT
        value: '10'
